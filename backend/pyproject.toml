[project]
name = "airstay-backend"
version = "0.1.0"
description = "AirStay API: FastAPI on SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "itsdangerous>=2.2.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
